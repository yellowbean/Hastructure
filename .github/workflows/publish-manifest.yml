name: Publish Multi-Arch Manifest

# Recovery / one-off tool: merges per-platform images that build jobs already
# pushed by digest into a single multi-arch manifest, without rebuilding.
# Use when a tag workflow's merge job fails after the digests were pushed.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Target tags (space separated)'
        required: true
        type: string
      digests:
        description: 'Source image digests (space separated)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PW }}

      - name: Create multi-arch manifest
        env:
          TAGS: ${{ inputs.tags }}
          DIGESTS: ${{ inputs.digests }}
        run: |
          echo "Tags:    $TAGS"
          echo "Digests: $DIGESTS"
          docker buildx imagetools create $(for t in $TAGS; do printf -- '-t %s ' "$t"; done) $DIGESTS

      - name: Inspect published manifests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          for t in $TAGS; do
            docker buildx imagetools inspect "$t"
          done
