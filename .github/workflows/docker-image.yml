name: Docker Image CI

# Release pipeline, triggered by pushing a tag that starts with `v`
# (e.g. `v0.52.12`), which:
#   * builds native binaries for linux/amd64, linux/arm64, macOS/arm64 and
#     Windows/amd64 and publishes them automatically to the GitHub "Releases"
#     page for that tag (the release is created non-draft, with generated notes);
#     every target is also published stripped, and Linux/Windows additionally
#     as a UPX-packed binary
#   * builds and pushes the amd64 image to Docker Hub (:latest + semver tags)
#   * publishes the tagged version to Hackage (the tag must match the cabal
#     version, e.g. `v0.53.0` <-> `version: 0.53.0`)
#
# NOTE: tags starting with `a` follow the dev track instead
# (.github/workflows/docker-image-dev-by-tag.yml -> Docker Hub :dev, multi-arch,
# no GitHub Release). GHC is pinned to the version proven green for the current
# code by `haskell.yml`; bump both together if the compiler moves.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GHC_VERSION: "9.12.4"

jobs:
  build_artifact:
    name: build/${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Runner image macos-26-arm64 20261013.0424.1 ships CLT with SDK 27.0
      # .tbd files (arm64e.x1-* arch entries) while the selected Xcode
      # toolchain's ld cannot parse them ("tapi error: malformed file").
      # Selecting the CLT toolchain aligns clang/ld/SDK. See
      # actions/runner-images#14940 and discourse.haskell.org/t/14675.
      - name: Align macOS toolchain (ld/SDK mismatch)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p && clang --version && ld -v

      - name: Setup Haskell
        id: setup-haskell-cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "latest"

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
          key: cabal-${{ matrix.name }}-${{ hashFiles('*.cabal') }}-${{ hashFiles('cabal.project*') }}
          restore-keys: |
            cabal-${{ matrix.name }}-

      - name: Cabal update
        run: cabal update

      - name: Build binary
        run: |
          mkdir -p dist
          cabal install Hastructure --install-method=copy --overwrite-policy=always --installdir=dist

      # Distinct per-OS asset names: the matrix legs would otherwise collide
      # (every non-Windows leg produces a binary called `Hastructure-exe`).
      - name: Stage asset name
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          mv "dist/Hastructure-exe${EXT}" "dist/Hastructure-${GITHUB_REF_NAME}-${{ matrix.name }}${EXT}"

      # Publish three variants of every Linux/Windows target (two on macOS),
      # all from the exact same build:
      #   Hastructure-<tag>-<target><ext>              normal, full symbol table
      #   Hastructure-<tag>-<target>-stripped<ext>     same code/data, no symbols
      #   Hastructure-<tag>-<target>-upx<ext>          stripped + UPX (-9)
      # Stripping here (instead of a second `cabal install`) guarantees the
      # binaries differ only in the symbol/debug metadata, and avoids doubling
      # the build time.
      - name: Create stripped variant
        id: variants
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          base="dist/Hastructure-${GITHUB_REF_NAME}-${{ matrix.name }}"
          full="${base}${EXT}"
          slim="${base}-stripped${EXT}"
          cp "$full" "$slim"
          chmod +x "$slim"

          if [ "$RUNNER_OS" = "macOS" ]; then
            # Apple's strip does not know --strip-unneeded. Rewriting the Mach-O
            # invalidates the linker's ad-hoc arm64 signature, so re-sign or the
            # binary is killed at exec time.
            /usr/bin/strip -x "$slim"
            codesign --force --sign - "$slim"
            codesign --verify --strict "$slim"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ghc_lib="$(ghc --print-libdir 2>/dev/null | sed 's|\\|/|g' || true)"
            candidates=()
            if [ -n "$ghc_lib" ]; then
              candidates+=("$(dirname "$ghc_lib")/mingw/bin/strip.exe")
            fi
            candidates+=("C:/msys64/usr/bin/strip.exe" "C:/Strawberry/c/bin/strip.exe")
            strip_bin=""
            for c in "${candidates[@]}"; do
              if [ -x "$c" ]; then strip_bin="$c"; break; fi
            done
            if [ -z "$strip_bin" ]; then strip_bin="$(command -v strip || true)"; fi
            if [ -z "$strip_bin" ]; then
              echo "No strip executable found (tried GHC mingw, MSYS2, Strawberry, PATH)" >&2
              exit 1
            fi
            echo "Using $strip_bin"
            "$strip_bin" --strip-unneeded "$slim"
          else
            strip --strip-unneeded "$slim"
          fi

          size_full=$(wc -c <"$full")
          size_slim=$(wc -c <"$slim")
          echo "unstripped: $size_full bytes, stripped: $size_slim bytes"
          test "$size_slim" -lt "$size_full"
          echo "stripped=$slim" >> "$GITHUB_OUTPUT"

      # Third variant for Linux and Windows only: strip first, then let UPX
      # pack a *copy* (the action compresses in place). macOS is excluded
      # because UPX/ghaction-upx does not support Mach-O.
      - name: Stage UPX variant
        id: upx
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          path="dist/Hastructure-${GITHUB_REF_NAME}-${{ matrix.name }}-upx${EXT}"
          cp "${{ steps.variants.outputs.stripped }}" "$path"
          chmod +x "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Compress UPX variant
        if: runner.os != 'macOS'
        uses: crazy-max/ghaction-upx@v4
        with:
          version: v5.2.1
          files: ${{ steps.upx.outputs.path }}
          args: -9

      - name: Verify UPX variant
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          size_stripped=$(wc -c <"${{ steps.variants.outputs.stripped }}")
          size_upx=$(wc -c <"${{ steps.upx.outputs.path }}")
          echo "stripped: $size_stripped bytes, upx: $size_upx bytes"
          test "$size_upx" -lt "$size_stripped"

      # The stripped and UPX assets are the ones at risk (symbols removed,
      # macOS re-signed, UPX-packed), so start each and require a real HTTP
      # answer before anything is published. Runs in `smoke/`, not `dist/`, to
      # keep config.yml/swagger.json out of the release assets.
      - name: Smoke test stripped and UPX variants
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          variants=(stripped)
          if [ "$RUNNER_OS" != "macOS" ]; then variants+=(upx); fi
          mkdir -p smoke
          cd smoke
          port=18080
          for variant in "${variants[@]}"; do
            bin="Hastructure-${GITHUB_REF_NAME}-${{ matrix.name }}-${variant}${EXT}"
            cp "../dist/$bin" .
            printf 'port: %s\n' "$port" > config.yml
            "./$bin" > "$variant.log" 2>&1 &
            pid=$!
            ok=0
            for _ in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port}/version" 2>/dev/null; then ok=1; break; fi
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            if [ "$ok" -ne 1 ]; then
              echo "$variant binary failed to serve /version" >&2
              cat "$variant.log" >&2
              exit 1
            fi
            port=$((port + 1))
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish to GitHub Releases
    needs: build_artifact
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # `gh` resolves the repository from the git checkout; without it
      # `gh release create` fails with "not a git repository".
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ls -la dist/
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --generate-notes --title "Hastructure $TAG"
          gh release upload "$TAG" --clobber dist/*

  docker:
    name: push Docker image
    needs: build_artifact
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup build folder (disk space)
        run: |
          rm -rf /opt/ghc /opt/hostedtoolcache 2>/dev/null || true

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PW }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/hastructure
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/hastructure:latest
            ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/hastructure:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/hastructure:buildcache,mode=max

  hackage_publish:
    name: Publish to Hackage
    # Independent of the GitHub release so a release-upload hiccup cannot block
    # the (immutable) Hackage publication.
    needs: build_artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "latest"

      # haskell-actions/hackage-publish only uploads tarballs found in
      # packagesPath (default dist-newstyle/sdist/); it does not run cabal sdist.
      - name: Build sdist
        run: cabal sdist

      - uses: haskell-actions/hackage-publish@v1
        with:
          hackageToken: ${{ secrets.HACKAGE_KEY }}
          publish: true
